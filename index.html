function setPreset(v){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),d=now.getDate(),today=Core.iso(y,m,d);state.filter.preset=v;state.filter.year='all';let s='',e='';if(v==='today')s=e=today;if(v==='yesterday')s=e=Core.iso(y,m,d-1);if(v==='7'||v==='30'){s=Core.iso(y,m,d-(+v)+1);e=today;}if(v==='month'){s=Core.iso(y,m,1);e=Core.iso(y,m,Core.daysIn(y,m));}if(v==='lastmonth'){s=Core.iso(y,m-1,1);e=Core.iso(y,m,0);}if(v!=='custom'){state.filter.start=s;state.filter.end=e;}}

function series(){const b=Core.bounds(state.data);if(!b)return [];let start=state.filter.start||b.start,end=state.filter.end||b.end;if(state.filter.year!=='all'){start=start>state.filter.year+'-01-01'?start:state.filter.year+'-01-01';end=end<state.filter.year+'-12-31'?end:state.filter.year+'-12-31';}if(start>end)return [];const sd=new Date(start+'T00:00Z'),ed=new Date(end+'T00:00Z'),out=[];let n=sd.getUTCFullYear()*12+sd.getUTCMonth(),last=ed.getUTCFullYear()*12+ed.getUTCMonth();for(;n<=last&&out.length<2400;n++){const y=Math.floor(n/12),m=n%12,s=Core.iso(y,m,1),e=Core.iso(y,m,Core.daysIn(y,m)),f={...state.filter,start:start>s?start:s,end:end<e?end:e};out.push({name:Core.MONTHS[m]+' '+y,short:Core.MONTHS[m].slice(0,3)+' '+String(y).slice(-2),start:s,end:e,from:f.start,to:f.end,a:agg(f)});}return out;}

function completion(f,p,invert=false,target=1,tolerance=.2){if(!Core.has(f)||!Core.has(p)||p<=0)return '<span class="muted">—</span>';const n=f/p,st=invert?n<=target?'good':n<=target+tolerance?'warning':'bad':n>=target?'good':n>=target-tolerance?'warning':'bad';return `<span class="completion ${st}" title="${st==='good'?'В пределах ориентира':st==='warning'?'Рядом с ориентиром':'Отклонение от ориентира'}">${st==='good'?'✓ ':st==='warning'?'≈ ':'! '}${fmt(n*100,'pct')}</span>`;}

function editor(){const m=currentEditorMonth(),a=agg(),prev=compareAgg(),t=state.view;const keys=t==='traffic'?['spend','leads','cpl','drr']:t==='smm'?['reach','smmLeads','subs','err']:['visits','orgLeads','orgRevenue'];if(!m)return `<div class="panel empty-state"><h2>${records().length?'Нет месяцев в выбранном периоде':'Создайте первый месяц'}</h2><p>Добавьте месяц или импортируйте данные из прежней версии.</p><div class="actions" style="justify-content:center;margin-top:20px"><button class="btn primary" data-action="add-month">${icon('plus')} Новый месяц</button><button class="btn" data-action="import">Импорт JSON</button><button class="btn" data-action="reset-filters">Сбросить фильтры</button></div></div>`;const mi=+state.selectedMonth;const ws=Core.selectedWeeks(state.data,mi,state.filter),rows=a.rows.filter(r=>r.mi===mi&&r.type===t);let count=0;const visible=Core.channels(m,t).map((ch,ci)=>({ch,ci})).filter(({ch})=>Core.alive(ch)&& (state.filter.channel==='all'||state.filter.channel===t+'|'+Core.name(ch))&&(!state.filter.q||Core.name(ch).toLowerCase().includes(state.filter.q.toLowerCase())||m.name.toLowerCase().includes(state.filter.q.toLowerCase())));return `${partialNotice(a)}<div class="kpi-grid" ${keys.length===3?'style="grid-template-columns:repeat(3,minmax(0,1fr))"':''}>${keys.map(k=>metricCard(k,a,prev)).join('')}</div><div class="editor-toolbar"><label class="field">Месяц для ввода<select id="editor-month" aria-label="Месяц для ввода">${options(activeMonths().map(x=>[x.i,x.m.name]),mi)}</select></label><button class="btn" data-action="collapse-all" data-value="true">Свернуть все</button><button class="btn" data-action="collapse-all" data-value="false">Развернуть все</button><button class="btn" data-action="recalc" title="Пересчитать · Alt+R">${icon('refresh')}</button><button class="btn" data-action="compact" title="Плотность таблиц">${state.compact?'Обычная плотность':'Компактно'}</button><button class="btn" data-action="undo" ${history.length?'':'disa function channelEditor(t,mi,ci,ch,ws,row){const fin=t!=='smm'&&finMode(t,mi,ci),all=t==='traffic'?['spend','leads','cpl','revenue','drr']:t==='organic'?['visits','leads','revenue']:ch.metrics;const mets=t==='traffic'?(fin?['spend','revenue','drr']:['spend','leads','cpl']):t==='organic'?(fin?['visits','leads','revenue']:['visits','leads']):ch.metrics;const base=`data-type="${t}" data-mi="${mi}" data-ci="${ci}"`,progress=timeProgress(mi);const minis=all.map(met=>{let f=row?.f[met],p=row?.p[met];if(met==='cpl'){f=Core.ratio(row?.f.spend,row?.f.leads);p=Core.ratio(row?.p.spend,row?.p.leads);}if(met==='drr')f=Core.ratio(row?.f.spend,row?.f.revenue,100);return `<span>${esc(metricLabel(t,met))}: <b>${fmt(f,metricKind(t,met))}</b> / ${fmt(p,metricKind(t,met))} ${completion(f,p,['spend','cpl','drr'].includes(met),Core.pct(met)||['cpl','drr'].includes(met)?1:progress)}</span>`;}).join('');return `<article class="channel-block"><div class="channel-title"><div><h3>${esc(Core.name(ch))}</h3><div class="mini-summary">${minis}</div></div><div class="actions">${t==='smm'?`<button class="btn small" data-action="metrics" ${base}>Метрики</button>${/dzen|дзен/i.test(ch.name)?`<button class="btn small" data-action="dzen" ${base}>Рассчитать %</button>`:''}`:`<button class="btn small" data-action="finance" ${base} aria-pressed="${fin}">${fin?'Показатели':'Финансы'}</button>`}<button class="btn small danger" data-action="delete-channel" ${base}>Удалить</button></div></div><div class="table-scroll"><table class="entry-table" style="min-width:${Math.max(640,260+mets.length*145)}px"><thead><tr><th>Неделя / день</th><th>Тип</th>${mets.map(met=>`<th>${esc(metricLabel(t,met))}</th>`).join('')}</tr></thead><tbody>${ws.map(w=>weekEditor(t,mi,ci,mets,w)).join('')}</tbody></table></div></article>`;}

`;}
function quality(){const issues=[];const cols=Core.collisions(state.data);cols.forEach(c=>issues.push({kind:'collision',...c,title:'Совпадающий ключ SMM',detail:state.data.monthsData[c.mi].name+' / '+state.data.monthsData[c.mi].smmChannels[c.ci].name+' · '+c.metrics.join(', ')+' · '+c.count+' значений'}));const months=records();const seen=new Set();months.forEach(({m})=>{if(seen.has(m.name))issues.push({title:'Повтор календарного месяца',detail:m.name+': записи суммируются. Проверьте, что это отдельные данные.'});seen.add(m.name);});let neg=0;Object.entries(state.data.inputState).forEach(([k,v])=>{if(!k.startsWith('ui_')&&typeof v==='number'&&v<0)neg++;});if(neg)issues.push({title:'Отрицательные значения: '+neg,detail:'Они сохранены. Приток может быть отрицательным; отрицательные расходы и количества требуют проверки.'});if(!months.length)issues.push({title:'Нет месяцев',detail:'Создайте месяц или импортируйте JSON-копию.'});return issues;}
function dataUI(){const q=quality(),n=Object.keys(state.data.inputState).filter(k=>!k.startsWith('ui_')&&Core.has(state.data.inputState[k])).length;return `<div class="data-grid"><section class="panel data-card">${icon('download')}<h2>Резервное копирование</h2><p>${records().length} месяцев · ${NF.format(n)} сохранённых значений. Полная JSON-копия включает структуру, исходные значения и служебные поля. CSV содержит только выбранную аналитику.</p><div class="actions"><button class="btn primary" data-action="backup">Скачать JSON</button><button class="btn" data-action="restore">Восстановить предыдущую копию</button></div></section><section class="panel data-card">${icon('upload')}<h2>Импорт и перенос</h2><p>Поддерживается структура прежней версии <b>monthsData + inputState</b>, экспорт Firebase с узлом <b>kpi_project</b> и копии Контур. Перед заменой текущая версия сохраняется.</p><div class="actions"><button class="btn primary" data-action="import">Выбрать JSON</button><button class="btn" data-action="paste-import">Вставить JSON</button></div></section><section class="panel data-card">${icon('cloud')}<h2>Прежнее облако Firebase</h2><p>Google-вход и данные исходного проекта. Облако требует интернета и открытия с разрешённого HTTP(S)-адреса. При file:// используйте JSON-экспорт Firebase или перенос из старой вкладки.</p><div class="actions"><button class="btn" data-action="cloud">${state.cloud?'Управление подключением':'Подключить облако'}</button><button class="btn" data-action="migration">Как перенести</button></div>${state.remote?'<p class="good">Получена облачная версия. Доступен просмотр и принятие.</p>':''}</section><section class="panel data-card">${icon('shield')}<h2>Локальное хранилище</h2><p>Данные хранятся в localStorage этого браузера. Перемещение HTML-файла, другой браузер или очистка данных сайта могут изменить доступ к хранилищу. Регулярно скачивайте JSON.</p><div class="actions"><button class="btn" data-action="undo" ${history.length?'':'disabled'}>Отменить последнее действие</button><button class="btn" data-action="backup-portable">HTML с текущими данными</button></div></section></div><section class="panel" style="margin-top:20px"><div class="panel-head"><div><h2>Качество данных</h2><p>Проверки структуры, календаря, ключей и значений</p></div><span class="tag ${q.length?'':'good'}">${q.length?q.length+' замечаний':'Проверки пройдены'}</span></div><div class="quality-list">${q.length?q.map((x,i)=>`<div class="quality-item"><div><strong>${esc(x.title)}</strong><p>${esc(x.detail)}</p></div>${x.kind==='collision'?`<button class="btn small" data-action="resolve-collision" data-index="${i}">Уточнить</button>`:''}</div>`).join(''):'<p class="muted small">Структурных замечаний не найдено. Достоверность исходных значений проверяет владелец данных.</p>'}</div></section>`;}
function helpUI(){return `<div class="panel"><div class="panel-head"><h2>Показатели и правила расчёта</h2><span class="tag blue">Методология</span></div><div class="help-body"><p>Расчёты используют только действующие месяцы и каналы и общий набор фильтров. «—» означает отсутствие данных или невозможность расчёта; 0 — заполненный ноль.</p><div class="table-scroll"><table><thead><tr><th>Показатель</th><th style="text-align:left">Правило</th></tr></thead><tbody>${Object.values(METRIC_INFO).map(v=>`<tr><td class="no-wrap">${v[0]}</td><td style="text-align:left;min-width:360px;white-space:normal">${v[2]}</td></tr>`).join('')}</tbody></table></div><h3>Дни, недели и месяцы</h3><p>Счётные показатели суммируются. Если у метрики есть дневные значения, недельный факт вычисляется из них. В противном случае используется сохранённый недельный факт. Приложение не стирает исходный недельный ввод при расчёте. Для перехода обратно к недельному вводу очистите все дни этой метрики.</p><p>План хранится на уровне недели. При выборе части недели план и недетализированный недельный факт не делятся пропорционально дням: такие значения исключаются с предупреждением. Недели без дат доступны только при выборе полного месяца.</p><h3>SMM и проценты</h3><p>ERR взвешивается по первой счётной метрике охвата/показов/просмотров канала. Без положительной базы он не вычисляется. Прочие проценты: среднее заполненных дней на неделе и среднее заполненных недель за период; план и факт усредняются независимо. При этом каждый канал остаётся отдельным, проценты разных каналов не складываются.</p><p>В Дзен ввод в таблице — всегда процент. Кнопка «Рассчитать %» сохраняет прежний сценарий «количество / показы × 100», но делает преобразование явным и проверяет базу. Старая версия использовала короткие ключи: «Посещения профиля», «Просмотры», «Показы» могут иметь общий ключ. Такие значения сохраняются, но не учитываются до выбора владельца в разделе данных.</p><h3>Сравнение и прогноз</h3><p>Изменение = факт − база; изменение в % = (факт − база) / |база| × 100. При базе 0 процент отсутствует. Полные месяцы сравниваются с предыдущими полными месяцами; произвольные интервалы — с таким же числом предшествующих календарных дней. Для прошлого года 29 февраля переносится на 28 февраля. Прогноз Traffic сохранён из исходника: лиды / активные дни × длина месяца; активен день с положительными лидами или расходами. Прогноз относится к целому выбранному месяцу, даже если глобально выбран его фрагмент.</p><p>Месячные индикаторы план/факт учитывают долю прошедших дней; допуск 20 п.п. Недельные индикаторы сравниваются с полным планом. Расход и CPL: меньше плана лучше; остальные счётные KPI: больше лучше. Цвет сопровождается знаком и подсказкой. Сигналы ≥20% — пороговые проверки, а не статистическая модель аномалий.</p><h3>Сохранение и безопасность</h3><p>Оригинальная структура и индексы сохранены. Удаление помечает запись и сохраняет значения; добавление не переиспользует её индекс. Для SMM новые значения используют полные уникальные ключи v2. Неоднозначные старые ключи не преобразуются автоматически. JSON-копии сохраняют неизвестные поля. CSV безопасен для открытия в Excel и не является резервной копией.</p><h3>Клавиатура</h3><div class="shortcuts">${[['Alt+1…4','Разделы аналитики'],['Alt+N','Новый месяц'],['Alt+T','Смена темы'],['Alt+R','Пересчитать'],['Ctrl/Cmd+Z','Отменить действие вне поля'],['Esc','Закрыть окно']].map(([a,b])=>`<div><span>${b}</span><kbd>${a}</kbd></div>`).join('')}</div><h3>Облако</h3><p>Локальная работа не требует входа и интернета. Облачный режим использует исходный Firebase-проект и его правила доступа, с Google OAuth и подпиской на обновления. Полученные изменения предлагаются для принятия; отправка локальных изменений выполняется отдельной командой с проверкой конфликтов. При открытии через file:// Google-вход недоступен; используйте JSON-перенос.</p><p>Справка Firebase: <a href="https://firebase.google.com/docs/auth/web/google-signin" target="_blank" rel="noopener">Google-вход</a> · <a href="https://firebase.google.com/docs/database/web/read-and-write" target="_blank" rel="noopener">Чтение и запись данных</a>.</p></div></div>`;}
function modal(title,body,submit,label='Сохранить'){if($('modal').open)$('modal').close();$('modal-title').textContent=title;$('modal-body').innerHTML=body+'<p id="modal-error" class="dialog-error" role="alert"></p>';$('modal-submit').textContent=label;$('modal-submit').hidden=!submit;modalSubmit=submit;$('modal').showModal();}
function closeModal(){$('modal').close();modalSubmit=null;}
function confirmAction(title,body,fn,label='Подтвердить'){modal(title,`<p>${esc(body)}</p>`,()=>{closeModal();fn();},label);}
function download(filename,text,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function backup(){download('Kontur_Backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state.data,null,2),'application/json');toast('Резервная копия подготовлена к скачиванию.');}
function portable(){const copy=document.documentElement.cloneNode(true);copy.querySelectorAll('#embedded-data').forEach(el=>el.remove());const tag=document.createElement('script');tag.type='application/json';tag.id='embedded-data';tag.textContent=JSON.stringify(state.data).replace(/</g,'\\u003c');copy.querySelector('head').append(tag);const dlg=copy.querySelector('#modal');dlg.removeAttribute('open');copy.querySelector('#toast').textContent='';download('Marketing_Dashboard_With_Data.html','<!doctype html>\n'+copy.outerHTML,'text/html');toast('Создан HTML со снимком текущих данных. Он содержит ваши показатели.');}
function csv(){const a=agg();const rows=[['Месяц','Направление','Канал','Метрика','План','Факт','Начало фильтра','Конец фильтра']];a.rows.forEach(r=>{const mets=new Set([...Object.keys(r.p),...Object.keys(r.f)]);mets.forEach(m=>rows.push([r.month,VIEWS[r.type][0],r.name,metricLabel(r.type,m),r.p[m]??'',r.f[m]??'',state.filter.start,state.filter.end]));if(r.type==='traffic'){rows.push([r.month,'Платный трафик',r.name,'CPL A+B',Core.ratio(r.p.spend,r.p.leads)??'',Core.ratio(r.f.spend,r.f.leads)??'',state.filter.start,state.filter.end]);rows.push([r.month,'Платный трафик',r.name,'ДРР',Core.ratio(r.p.spend,r.p.revenue,100)??'',Core.ratio(r.f.spend,r.f.revenue,100)??'',state.filter.start,state.filter.end]);}});const safe=v=>{let s=typeof v==='number'?String(v).replace('.',','):String(v);if(typeof v!=='number'&&/^[\s]*[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};download('Kontur_Analytics.csv','\uFEFF'+rows.map(r=>r.map(safe).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
function importPreview(raw,label='файла'){const result=Core.validate(raw),d=result.data;const count=d.monthsData.filter(m=>m&&!m._deleted).length,fields=Object.keys(d.inputState).length;modal('Проверка импорта',`<div class="notice">Из ${esc(label)}: <b>${count} месяцев</b> и <b>${NF.format(fields)} значений</b>.</div><p>Данные в текущем рабочем пространстве будут заменены. Перед заменой сохраняется предыдущая локальная версия. Исходный файл не меняется.</p>${result.collisions.length?`<div class="notice warning">${result.collisions.length} групп с совпадающими SMM-ключами. Значения сохранятся, но не будут учтены до уточнения в разделе данных.</div>`:''}${result.warnings.length?`<p>${result.warnings.length} замечаний:</p><ul>${result.warnings.slice(0,10).map(w=>'<li>'+esc(w)+'</li>').join('')}</ul>`:''}`,()=>{if(state.blockedRaw){download('Kontur_Damaged_Storage.json',state.blockedRaw,'application/json');state.blockedRaw=null;}closeModal();changed('Импорт',()=>{state.data=d;state.filter=blankFilters();state.selectedMonth=null;state.view='overview';state.blockedExternal=false;},true);toast('Импорт завершён. Предыдущая версия доступна в разделе данных.');},'Импортировать');}
function showImportError(e){modal('Импорт не выполнен',`<p class="dialog-error">${esc(e.message)}</p><p>Текущие данные не изменены. Исправьте структуру файла и повторите импорт.</p>`,null);}
function monthDialog(source=null){const rs=records(),last=rs.at(-1)?.d,now=new Date(),next=last?new Date(Date.UTC(last.year,last.month+1,1)):new Date(Date.UTC(now.getFullYear(),now.getMonth(),1)),value=Core.iso(next.getUTCFullYear(),next.getUTCMonth(),1).slice(0,7);modal(source===null?'Новый месяц':'Копировать структуру месяца',`<label class="field">Календарный месяц<input type="month" id="new-month" value="${value}" required min="1900-01" max="2200-12"></label><p>${source===null?'Каналы будут взяты из последнего активного месяца. Для первого месяца используется набор каналов исходного приложения.':'Копируются каналы, метрики и заметка. Числовые планы и факты не копируются — так работала исходная функция.'}</p>`,()=>{const value=$('new-month').value;if(!/^\d{4}-\d{2}$/.test(value))throw Error('Выберите месяц.');const [y,mo]=value.split('-').map(Number);if(y<1900||y>2200||mo<1||mo>12)throw Error('Выберите месяц с 1900 по 2200 год.');const nm=Core.MONTHS[mo-1]+' '+y;if(records().some(x=>x.m.name===nm))throw Error('Этот месяц уже существует.');const src=source!==null?state.data.monthsData[source]:rs.at(-1)?.m;const ch=src?(src.channels||[]).filter(Core.alive):['Яндекс Директ'];const smm=src?structuredClone((src.smmChannels||[]).filter(Core.alive)):structuredClone(Core.DEFAULT_SMM);if((y>2026||y===2026&&mo>=3)&&!smm.some(c=>/^youtube$/i.test(c.name)))smm.push({name:'YouTube',metrics:['Просмотры','Чистый приток подписчиков','ERR']});const org=src?(src.organicChannels||[]).filter(Core.alive):['Яндекс','Google','Прямые заходы','Внутренние переходы'];closeModal();changed('Добавление месяца',()=>{state.data.monthsData.push({name:nm,collapsed:false,channels:ch,smmChannels:smm,organicChannels:org,weeks:Core.weeks(y,mo-1),notes:source!==null?src.notes||'':''});state.selectedMonth=state.data.monthsData.length-1;state.filter=blankFilters();state.view='traffic';});},'Создать месяц');}
function channelDialog(t,mi){modal('Новый канал',`<label class="field">Название<input id="channel-name" required maxlength="200" placeholder="Название канала"></label>${t==='smm'?`<div><p>Метрики канала</p><div class="checks">${Core.METRICS.map(m=>`<label><input type="checkbox" name="metrics" value="${esc(m)}">${esc(m)}</label>`).join('')}</div></div>`:''}`,()=>{const n=$('channel-name').value.trim();if(!n)throw Error('Введите название.');if(Core.channels(state.data.monthsData[mi],t).some(c=>Core.alive(c)&&Core.name(c).toLowerCase()===n.toLowerCase()))throw Error('Канал с таким названием уже есть.');const mets=[...document.querySelectorAll('[name=metrics]:checked')].map(el=>el.value);if(t==='smm'&&!mets.length)throw Error('Выберите хотя бы одну метрику.');closeModal();changed('Добавление канала',()=>{const m=state.data.monthsData[mi],key=t==='traffic'?'channels':t==='smm'?'smmChannels':'organicChannels';(m[key]??=[]).push(t==='smm'?{name:n,metrics:mets}:n);state.filter.channel='all';});},'Добавить');}
function metricsDialog(mi,ci){const ch=state.data.monthsData[mi].smmChannels[ci],mets=[...new Set([...Core.METRICS,...ch.metrics])];modal('Метрики · '+ch.name,`<p>Снятая метрика скрывается из аналитики. Её значения сохраняются и вернутся при повторном добавлении.</p><div class="checks">${mets.map(m=>`<label><input type="checkbox" name="metrics" value="${esc(m)}" ${ch.metrics.includes(m)?'checked':''}>${esc(m)}</label>`).join('')}</div>`,()=>{const selected=[...document.querySelectorAll('[name=metrics]:checked')].map(el=>el.value);if(!selected.length)throw Error('Оставьте хотя бы одну метрику.');closeModal();changed('Изменение метрик',()=>{ch.metrics=selected;},true);});}
function dzenDialog(mi,ci){const ch=state.data.monthsData[mi].smmChannels[ci],m=state.data.monthsData[mi],pct=ch.metrics.filter(Core.pct),reach=ch.metrics.find(Core.reach);if(!pct.length||!reach){toast('Нужны процентная метрика и счётная база показов/просмотров.');return;}const periods=[];m.weeks.forEach((w,wi)=>{periods.push([`${wi}|plan|`,'План недели '+w.title],[`${wi}|fact|`,'Факт недели '+w.title]);(w.days||[]).forEach((d,di)=>periods.push([`${wi}|fact|${di}`,d.num+' число · '+w.title]));});modal('Дзен · из количества в процент',`<p>Формула: количество / «${esc(reach)}» × 100. Прямой ввод процентов в таблице не преобразуется.</p><label class="field">Метрика<select id="dz-metric">${options(pct.map(x=>[x,x]),pct[0])}</select></label><label class="field">Период<select id="dz-period">${options(periods,periods[0][0])}</select></label><label class="field">Количество событий<input id="dz-count" inputmode="decimal" placeholder="Например 125" required></label>`,()=>{const [wi,ph,di]=$('dz-period').value.split('|'),met=$('dz-metric').value,count=Core.parseNum($('dz-count').value,'number'),day=di===''?null:+di;if(count===null||count<0)throw Error('Введите неотрицательное количество.');if(day===null&&ph==='fact'&&(m.weeks[wi].days||[]).some((_,i)=>Core.has(Core.read(state.data,'smm',mi,ci,+wi,met,'fact',i))))throw Error('Недельный факт вычисляется из дней. Выберите день.');const base=day===null?Core.weekValue(state.data,'smm',mi,ci,+wi,reach,ph):Core.read(state.data,'smm',mi,ci,+wi,reach,'fact',day);if(!(base>0))throw Error('Сначала внесите положительную базу в «'+reach+'».');const k=Core.key('smm',mi,ci,+wi,met,ph,day);closeModal();changed('Расчёт процента Дзен',()=>state.data.inputState[k]=count/base*100);});}
function filterDialog(){modal('Сохранённые фильтры',`<label class="field">Название текущего набора<input id="filter-name" maxlength="80" placeholder="Например: Traffic за месяц"></label><div class="stack">${state.presets.length?state.presets.map((p,i)=>`<div class="actions" style="justify-content:space-between"><span>${esc(p.name)}</span><div class="actions"><button type="button" class="btn small" data-action="apply-preset" data-index="${i}">Применить</button><button type="button" class="btn small danger" data-action="delete-preset" data-index="${i}" aria-label="Удалить набор ${esc(p.name)}">×</button></div></div>`).join(''):'<p>Сохранённых наборов пока нет.</p>'}</div>`,()=>{const n=$('filter-name').value.trim();if(!n)throw Error('Введите название набора.');const x={name:n,filter:structuredClone(state.filter),compare:state.compare};const i=state.presets.findIndex(x=>x.name===n);if(i>=0)state.presets[i]=x;else state.presets.push(x);savePrefs();closeModal();toast('Набор фильтров сохранён.');},'Сохранить текущий');}
function resolveCollision(index){const c=quality()[index];if(!c||c.kind!=='collision')return;modal('Уточнение совпавшего ключа',`<p>Старая версия хранила эти метрики под одним ключом. Восстановить потерянное различие автоматически невозможно. Выберите владельца сохранённых значений; остальные метрики останутся пустыми до ввода. Исходные ключи сохранятся.</p><label class="field">Владелец значений<select id="collision-owner">${options(c.metrics.map(m=>[m,m]),c.metrics[0])}</select></label>`,()=>{const owner=$('collision-owner').value;closeModal();changed('Уточнение SMM-ключа',()=>{state.data._md.legacyOwners??={};state.data._md.legacyOwners[`${c.mi}/${c.ci}/${c.slug}`]=owner;},true);});}
function metricDialog(k){const v=METRIC_INFO[k],a=agg(),p=compareAgg(),d=p?Core.delta(a.f[k],p.f[k]):null;modal(v[0],`<div class="kpi-value">${fmt(a.f[k],v[1])}</div><p>${esc(v[2])}</p><p>План: ${fmt(a.p[k],v[1])}${d?' · Изменение: '+fmt(d.abs,v[1]):''}</p><p>Фильтр: ${esc(state.filter.start||'начало данных')} — ${esc(state.filter.end||'конец данных')} · ${esc(state.filter.channel==='all'?'все каналы':state.filter.channel)}</p>${!Core.has(a.f[k])?'<div class="notice warning">Недостаточно заполненных данных или положительной базы. Нулевое значение не подставляется.</div>':''}`,()=>{closeModal();navigate(v[3]);},'Перейти к данным');}
function migration(){modal('Перенос из прежней версии',`<p><b>Способ 1.</b> В Firebase Console откройте Realtime Database → узел kpi_project → Export JSON. Импортируйте скачанный файл здесь.</p><p><b>Способ 2.</b> В открытой и авторизованной вкладке старого дашборда выполните в консоли браузера приведённую команду. Она только создаёт локальную копию уже загруженных данных.</p><textarea id="migration-code" class="search" style="width:100%;min-height:160px;font-family:monospace;font-size:11px" readonly></textarea><p>Код не отправляет данные на сервер. После скачивания выберите «Импорт JSON» в новой версии.</p>`,null);$('migration-code').value=`(()=>{const data={monthsData,inputState};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='Marketing_Legacy_Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);})();`;}

async function loadSDK(){for(const name of ['app','auth','database']){const url=`https://www.gstatic.com/firebasejs/9.22.0/firebase-${name}-compat.js`;if(document.querySelector(`script[data-firebase="${name}"]`))continue;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=url;s.dataset.firebase=name;s.onload=resolve;s.onerror=()=>{s.remove();reject(Error('Не удалось загрузить Firebase. Проверьте подключение к интернету.'));};document.head.append(s);});}return window.firebase;}
function cloudDialog(){const local=location.protocol==='file:';modal('Облачное подключение',`<p>Используется исходный проект Firebase. Правила доступа и список разрешённых аккаунтов задаются на сервере. При подключении локальные данные не отправляются автоматически.</p>${local?'<div class="notice warning">Google-вход не работает через file://. Для автономного файла используйте JSON-перенос. Облачный режим доступен при размещении этого же HTML на разрешённом HTTP(S)-домене проекта.</div>':''}<div id="cloud-state" class="notice">${esc(state.cloud?.user?'Вход: '+state.cloud.user.email:'Не подключено')}</div><div class="actions">${!local?`<button type="button" class="btn primary" data-action="cloud-connect">Войти через Google</button>`:''}<button type="button" class="btn" data-action="migration">Инструкция переноса</button>${state.cloud?`<button type="button" class="btn" data-action="cloud-signout">Выйти</button>`:''}</div>${state.remote?`<div class="actions"><button type="button" class="btn" data-action="cloud-accept">Проверить облачную версию</button><button type="button" class="btn" data-action="cloud-download">Скачать облачный JSON</button><button type="button" class="btn" data-action="cloud-push">Отправить локальную версию</button></div>`:''}<p class="small">При изменении облачной версии отправка отменяется: сначала получите актуальные данные. Совместная работа со старой версией сохраняет её ограничения по SMM-ключам.</p>`,null);}
async function cloudConnect(){try{if(location.protocol==='file:')throw Error('Для file:// доступен JSON-перенос.');const el=$('cloud-state');if(el)el.textContent='Загрузка подключения…';const fb=await loadSDK();if(!fb.apps.length)fb.initializeApp(FIREBASE_CONFIG);const auth=fb.auth(),result=await auth.signInWithPopup(new fb.auth.GoogleAuthProvider());if(state.cloud?.ref)state.cloud.ref.off('value',state.cloud.listener);const ref=fb.database().ref('kpi_project');state.cloud={auth,ref,user:result.user,base:null,listener:null};const listener=snap=>{const raw=snap.val();try{const parsed=Core.validate(raw||{monthsData:[],inputState:{}});state.remote={raw,parsed:parsed.data};if(state.cloud.base===null)state.cloud.base=JSON.stringify(raw);toast('Получена облачная версия. Откройте «Данные» для проверки.');if(state.view==='data')render();if($('modal').open&&$('cloud-state'))cloudDialog();}catch(e){toast('Облачные данные не приняты: '+e.message);}};state.cloud.listener=listener;ref.on('value',listener,e=>{toast('Нет доступа к данным: '+e.message);if($('cloud-state'))$('cloud-state').textContent='Не удалось прочитать базу. Проверьте права аккаунта.';});cloudDialog();}catch(e){if($('cloud-state'))$('cloud-state').textContent='Подключение не выполнено: '+e.message;else toast(e.message);}}
async function cloudPush(){if(!state.cloud||!state.remote)return;confirmAction('Отправить данные в Firebase','Локальная версия заменит узел kpi_project. Перед записью будет скачана копия текущей облачной версии. Если сервер изменился с момента принятия данных, запись отменится.',async()=>{try{const c=state.cloud;const current=await c.ref.once('value'),raw=current.val();if(JSON.stringify(raw)!==c.base)throw Error('Облачная версия изменилась. Примите актуальную версию перед отправкой.');download('Kontur_Cloud_Before_Upload.json',JSON.stringify(raw,null,2),'application/json');const payload=structuredClone(state.data);const expected=c.base;const result=await c.ref.transaction(server=>JSON.stringify(server)===expected?payload:undefined,undefined,false);if(!result.committed)throw Error('Конфликт: другой пользователь изменил облачные данные.');c.base=JSON.stringify(payload);toast('Облачная запись подтверждена сервером.');}catch(e){toast('Не отправлено: '+e.message);}},'Отправить');}
let refreshTimer;
function commitCell(el){if(!el?.dataset?.cell||el.disabled||el.dataset.edited!=='true')return true;try{const d=el.dataset,kind=d.kind==='pct'?'number':d.kind,v=Core.parseNum(el.value,kind),mi=+d.mi,ci=+d.ci,wi=+d.wi,di=d.di===''?null:+d.di,k=Core.key(d.type,mi,ci,wi,d.metric,d.phase,di),old=Core.read(state.data,d.type,mi,ci,wi,d.metric,d.phase,di);el.removeAttribute('aria-invalid');el.dataset.edited='false';if(old===v)return true;checkpoint('Изменение ячейки');state.data.inputState[k]=v;state.revision++;cache.clear();state.data._md.updatedAt=new Date().toISOString();persist();clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>{const active=document.activeElement,ds=active?.dataset?.cell?{...active.dataset}:null;const selection=ds?[active.selectionStart,active.selectionEnd]:null;const draft=ds?active.value:null;render();if(ds){const target=[...document.querySelectorAll('[data-cell]')].find(x=>['type','mi','ci','wi','di','metric','phase'].every(k=>x.dataset[k]===ds[k]));if(target&&!target.disabled){target.focus();target.value=draft;target.dataset.edited=ds.edited||'false';try{target.setSelectionRange(...selection);}catch{}}}},200);return true;}catch(e){el.setAttribute('aria-invalid','true');toast(e.message);return false;}}
const actions={
'navigate':d=>navigate(d.view),'theme':()=>{state.theme=state.theme==='light'?'dark':'light';setTheme();savePrefs();},'add-month':()=>monthDialog(),'duplicate':d=>monthDialog(+d.mi),'add-channel':d=>channelDialog(d.type,+d.mi),'metrics':d=>metricsDialog(+d.mi,+d.ci),'dzen':d=>dzenDialog(+d.mi,+d.ci),'undo':undo,'backup':backup,'backup-portable':portable,'csv':csv,'import':()=>{$('import-file').value='';$('import-file').click();},'paste-import':()=>modal('Вставить JSON',`<label class="field">Содержимое резервной копии<textarea id="pasted-json" spellcheck="false" required placeholder='{"monthsData": [], "inputState": {}}'></textarea></label>`,()=>{let raw;try{raw=JSON.parse($('pasted-json').value);}catch{throw Error('Некорректный JSON. Проверьте скобки и кавычки.');}importPreview(raw,'вставленного JSON');},'Проверить'),
'close-modal':closeModal,'reset-filters':()=>{state.filter=blankFilters();state.page=0;render();},'filters':filterDialog,'apply-preset':d=>{const p=state.presets[+d.index];state.filter={...blankFilters(),...p.filter};state.compare=p.compare;closeModal();render();},'delete-preset':d=>{state.presets.splice(+d.index,1);savePrefs();filterDialog();},'compact':()=>{state.compact=!state.compact;setTheme();savePrefs();},'recalc':()=>{cache.clear();render();toast('Расчёты обновлены. Исходные значения сохранены.');},'more-channels':()=>{state.channelLimit+=12;render();},'metric':d=>metricDialog(d.metric),'sort':d=>{state.sort={key:d.key,dir:state.sort.key===d.key?-state.sort.dir:-1};render();},'page':d=>{state.page+=+d.step;render();},'channel-detail':d=>{state.filter.channel=d.type+'|'+d.name;navigate(d.type);},
'collapse-all':d=>changed('Сворачивание месяцев',()=>state.data.monthsData.forEach(m=>{if(m&&!m._deleted)m.collapsed=d.value==='true';})),
 'toggle-month':d=>changed('Сворачивание месяца',()=>state.data.monthsData[+d.mi].collapsed=!state.data.monthsData[+d.mi].collapsed),
 'toggle-week':d=>changed('Сворачивание недели',()=>state.data.inputState[`ui_v2_week_${d.type}_m${d.mi}_c${d.ci}_w${d.wi}`]=!weekCollapsed(d.type,+d.mi,+d.ci,+d.wi)),
 'toggle-days':d=>changed('Показ дней',()=>state.data.inputState[`ui_v2_days_${d.type}_m${d.mi}_c${d.ci}_w${d.wi}`]=!daysExpanded(d.type,+d.mi,+d.ci,+d.wi)),
 'finance':d=>changed('Финансовый режим',()=>state.data.inputState[`ui_v2_fin_${d.type}_m${d.mi}_c${d.ci}`]=!finMode(d.type,+d.mi,+d.ci)),
 'note':d=>{const m=state.data.monthsData[+d.mi];modal('Заметка · '+m.name,`<label class="field">Контекст месяца<textarea id="month-note" maxlength="10000">${esc(m.notes||'')}</textarea></label>`,()=>{const text=$('month-note').value;closeModal();changed('Заметка',()=>m.notes=text);});},
 'week-name':d=>{const w=state.data.monthsData[+d.mi].weeks[+d.wi];modal('Название недели',`<label class="field">Название<input id="week-name" required maxlength="100" value="${esc(w.title)}"></label><p>Меняется подпись во всех направлениях. Календарные дни не меняются.</p>`,()=>{const n=$('week-name').value.trim();if(!n)throw Error('Введите название.');closeModal();changed('Название недели',()=>w.title=n);});},
 'delete-month':d=>confirmAction('Удалить месяц?',state.data.monthsData[+d.mi].name+' будет исключён из всех расчётов. Данные сохранятся в резервной копии; действие можно отменить.',()=>changed('Удаление месяца',()=>state.data.monthsData[+d.mi]._deleted=true,true),'Удалить'),
 'delete-channel':d=>confirmAction('Удалить канал?','Канал будет исключён из аналитики. Значения сохранятся; действие можно отменить.',()=>changed('Удаление канала',()=>{const cs=Core.channels(state.data.monthsData[+d.mi],d.type);if(d.type==='smm')cs[+d.ci]._deleted=true;else{state.data._md.deletedChannels??={};state.data._md.deletedChannels[d.type+'/'+d.mi+'/'+d.ci]=cs[+d.ci];cs[+d.ci]='__deleted__';}},true),'Удалить'),
 'restore':()=>{let raw;try{raw=localStorage.getItem(BACK);}catch{}if(!raw){toast('Предыдущей копии пока нет. Используйте импорт JSON.');return;}try{importPreview(JSON.parse(raw),'предыдущей локальной копии');}catch(e){showImportError(e);}},'resolve-collision':d=>resolveCollision(+d.index),'migration':migration,'cloud':cloudDialog,'cloud-connect':cloudConnect,'cloud-push':cloudPush,'cloud-download':()=>download('Kontur_Cloud.json',JSON.stringify(state.remote.raw,null,2),'application/json'),
 'cloud-accept':()=>{const remote=state.remote;if(!remote)return;importPreview(remote.parsed,'облака');const fn=modalSubmit;modalSubmit=()=>{fn();if(state.cloud)state.cloud.base=JSON.stringify(remote.raw);};},
 'cloud-signout':async()=>{try{const c=state.cloud;c.ref.off('value',c.listener);await c.auth.signOut();state.cloud=null;state.remote=null;cloudDialog();render();}catch(e){toast(e.message);}}
};
$('modal-form').addEventListener('submit',async e=>{e.preventDefault();$('modal-error').textContent='';try{if(modalSubmit)await modalSubmit();}catch(err){$('modal-error').textContent=err.message;}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const invalid=document.querySelector('[data-cell][aria-invalid=true]');if(invalid){invalid.focus();toast('Исправьте значение ячейки перед продолжением.');return;}const fn=actions[el.dataset.action];if(fn){e.preventDefault();clearTimeout(refreshTimer);try{Promise.resolve(fn(el.dataset)).catch(err=>toast(err.message));}catch(err){toast(err.message);}}});
document.addEventListener('focusin',e=>{if(e.target.dataset.cell){editing=true;}});
document.addEventListener('focusout',e=>{if(e.target.dataset.cell){editing=false;commitCell(e.target);}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.cell){commitCell(el);return;}if(el.dataset.filter){const name=el.dataset.filter,value=el.value;if(['start','end'].includes(name)){const other=name==='start'?state.filter.end:state.filter.start;if(value&&!Core.validDate(value)){toast('Некорректная дата.');el.value=state.filter[name];return;}if(value&&other&&(name==='start'?value>other:value<other)){toast('Начало периода должно быть не позже конца.');el.value=state.filter[name];return;}state.filter[name]=value;state.filter.preset='custom';state.filter.year='all';}else if(name==='preset')setPreset(value);else{state.filter[name]=value;if(name==='year'){state.filter.start=value==='all'?'':value+'-01-01';state.filter.end=value==='all'?'':value+'-12-31';state.filter.preset=value==='all'?'all':'custom';state.filter.channel='all';}}state.page=0;render();}if(el.id==='comparison-mode'){state.compare=el.value;render();}if(el.id==='chart-metric'){state.chart=el.value;render();}if(el.id==='editor-month'){state.selectedMonth=+el.value;state.channelLimit=12;render();}});
let searchTimer;document.addEventListener('input',e=>{if(e.target.dataset.cell)e.target.dataset.edited='true';if(e.target.id==='channel-search'){const v=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.filter.q=v;render();const el=$('channel-search');if(el){el.focus();el.setSelectionRange(v.length,v.length);}},250);}});
$('import-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>50*1024*1024)throw Error('Максимальный размер JSON — 50 МБ.');toast('Проверяю файл…');const text=await f.text();let raw;try{raw=JSON.parse(text.replace(/^\uFEFF/,''));}catch{throw Error('Файл не является корректным JSON.');}importPreview(raw,f.name);}catch(err){showImportError(err);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')return;const isInput=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!isInput&&!$('modal').open){e.preventDefault();undo();return;}if(!e.altKey||$('modal').open)return;const k=e.code;const map={Digit1:'overview',Digit2:'traffic',Digit3:'smm',Digit4:'organic'};if(map[k]){e.preventDefault();if(isInput&&!commitCell(document.activeElement))return;navigate(map[k]);}if(k==='KeyN'){e.preventDefault();monthDialog();}if(k==='KeyT'){e.preventDefault();actions.theme();}if(k==='KeyR'){e.preventDefault();actions.recalc();}});
window.addEventListener('beforeunload',e=>{commitCell(document.activeElement);if(state.dirty||document.querySelector('[aria-invalid=true]')){e.preventDefault();e.returnValue='';}});
window.addEventListener('storage',e=>{if(e.key===STORE&&e.newValue){state.storageError='Данные изменены в другой вкладке. Экспортируйте свою копию перед перезагрузкой.';updateStatus();toast(state.storageError);state.blockedExternal=true;}});
const basePersist=persist;
persist=function(){if(state.blockedRaw||state.blockedExternal){state.dirty=true;state.storageError=state.blockedRaw?'Исходное хранилище повреждено. Для сохранения новой версии используйте JSON.':'Другая вкладка изменила данные. Скачайте копию и перезагрузите страницу.';updateStatus();return;}basePersist();};
try{const raw=localStorage.getItem(STORE);if(raw){try{state.data=Core.validate(JSON.parse(raw)).data;state.savedAt=state.data._md.updatedAt||null;}catch(e){state.blockedRaw=raw;state.storageError='Хранилище не прочитано. Исходные данные сохранены без изменений.';setTimeout(()=>modal('Нужно восстановление',`<p class="dialog-error">${esc(e.message)}</p><p>Приложение не будет перезаписывать повреждённое хранилище. Скачайте его для восстановления или импортируйте исправную копию.</p>`,()=>{download('Kontur_Damaged_Storage.json',raw,'application/json');closeModal();},'Скачать исходные данные'),50);}}else{const embedded=$('embedded-data');if(embedded){state.data=Core.validate(JSON.parse(embedded.textContent)).data;persist();}}}catch(e){state.storageError='Хранилище недоступно. Работайте с JSON-копиями.';}
if($('embedded-data')&&records().length){try{const embed=Core.validate(JSON.parse($('embedded-data').textContent)).data;if(JSON.stringify(embed)!==JSON.stringify(state.data))setTimeout(()=>importPreview(embed,'снимка внутри HTML'),60);}catch(e){toast('Встроенный снимок не прочитан: '+e.message);}}
window.MarketingCore=Core;
render();
})();
